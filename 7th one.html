<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Nexus • Glassmorphism Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Poppins',sans-serif; }
  body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: url('https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=1470&q=80') no-repeat center center/cover;
    background-attachment: fixed;
    padding: 1.5rem;
  }
  body::before {
    content:"";
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.25);
    backdrop-filter: brightness(0.95);
    z-index: -1;
  }
  .login-form {
    background: rgba(25,30,35,0.35);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 2rem 2rem 2.2rem;
    border-radius: 2rem;
    backdrop-filter: blur(18px) saturate(180%);
    text-align: center;
    color: #fff;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3),0 0 0 1px rgba(255,255,255,0.1);
    transition: transform 0.25s ease, box-shadow 0.3s ease;
  }
  .login-form:hover { transform: translateY(-5px); box-shadow:0 28px 45px rgba(0,0,0,0.35); }
  .login-title {
    font-size:2.6rem;
    font-weight:600;
    letter-spacing:-0.5px;
    margin-bottom:1.8rem;
    background: linear-gradient(135deg,#FFFFFF,#e0e8ff);
    background-clip:text; -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  .input-box { margin:1.5rem 0; position:relative; }
  .input-box input {
    width:100%;
    background: rgba(255,255,255,0.18);
    border:none;
    padding: 14px 18px 14px 48px;
    border-radius:60px;
    outline:2px solid transparent;
    transition: all 0.25s ease;
    font-size:1rem;
    color:#fef9e8;
    font-weight:500;
    backdrop-filter: blur(4px);
    letter-spacing:0.3px;
  }
  .input-box input::placeholder { color: rgba(245,245,250,0.75); font-weight:450; font-size:0.95rem; }
  .input-box input:focus {
    outline:2px solid rgba(255,255,255,0.65);
    background: rgba(255,255,255,0.25);
    box-shadow:0 0 0 3px rgba(255,255,255,0.2);
  }
  .input-box i {
    position:absolute; left:18px; top:50%; transform: translateY(-50%);
    font-size:1.25rem; color:rgba(255,250,235,0.9); pointer-events:none;
  }
  .remember-forgot-box {
    display:flex; justify-content:space-between; align-items:center;
    margin:1.2rem 0 1.8rem; font-size:0.85rem; font-weight:500;
    flex-wrap:wrap; gap:0.5rem;
  }
  .remember-forgot-box label {
    display:flex; gap:8px; cursor:pointer; align-items:center;
    background: rgba(0,0,0,0.2); padding:5px 12px 5px 8px; border-radius:40px;
    transition: background 0.2s;
  }
  .remember-forgot-box label:hover { background: rgba(255,255,255,0.1); }
  .remember-forgot-box input { accent-color:#3aa8ff; width:16px; height:16px; cursor:pointer; margin:0; }
  .remember-forgot-box a { color:#f0f3ff; text-decoration:none; font-weight:500; border-bottom:1px dashed rgba(255,255,255,0.5); transition:0.2s; }
  .remember-forgot-box a:hover { color:white; border-bottom:1px solid white; }
  .login-btn {
    width:100%; padding:12px 0; background: linear-gradient(105deg,#2f9cf4,#1a7bcb);
    border:none; border-radius:60px; color:white; font-size:1.05rem; font-weight:600;
    cursor:pointer; transition: all 0.25s ease; letter-spacing:0.5px; box-shadow:0 6px 14px rgba(0,0,0,0.2); margin-top:8px;
  }
  .login-btn:hover { background: linear-gradient(105deg,#3aaaff,#2182e0); transform:scale(1.01); box-shadow:0 10px 20px rgba(0,0,0,0.25); }
  .login-btn:active { transform:scale(0.98); }
  .register {
    margin-top:1.6rem; font-size:0.85rem; background: rgba(0,0,0,0.25);
    display:inline-block; width:100%; padding:8px 0; border-radius:60px; backdrop-filter: blur(2px);
  }
  .register a { color:#ffffff; text-decoration:none; font-weight:600; margin-left:6px; border-bottom:1px solid #ffffffb3; transition:0.2s; }
  .register a:hover { border-bottom:1px solid white; color:#d9eeff; }
  .input-box.error-shake input { animation: shake 0.4s ease-in-out 0s 1; outline: 2px solid #ffb347; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .toast-message {
    position: fixed; bottom:30px; left:50%; transform:translateX(-50%) scale(0.9);
    background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
    color:#fff; padding:10px 24px; border-radius:60px; font-size:0.85rem; font-weight:500; letter-spacing:0.3px;
    z-index:1000; opacity:0; transition:opacity 0.2s, transform 0.2s; pointer-events:none;
    white-space: nowrap; border-left:4px solid #2f9cf4; font-family: monospace;
  }
  .toast-message.show { opacity:1; transform:translateX(-50%) scale(1); }
  @media (max-width:480px){
    .login-form { padding:1.6rem; border-radius:1.5rem; }
    .login-title { font-size:2rem; }
    .input-box input { padding:12px 12px 12px 44px; font-size:0.9rem; }
    .remember-forgot-box { font-size:0.75rem; }
    .toast-message { font-size:0.75rem; padding:6px 18px; }
  }
</style>
</head>
<body>

<form action="#" class="login-form" id="nexusLoginForm">
  <h1 class="login-title">Welcome back</h1>

  <div class="input-box" id="usernameBox">
    <i class="fa-solid fa-user-astronaut"></i>
    <input type="text" id="loginUsername" placeholder="Username / Email" autocomplete="username">
  </div>
  <div class="input-box" id="passwordBox">
    <i class="fa-solid fa-key"></i>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
  </div>

  <div class="remember-forgot-box">
    <label for="rememberCheck">
      <input type="checkbox" id="rememberCheck">
      Keep me signed in
    </label>
    <a href="#" id="forgotPwdTrigger">Recover access?</a>
  </div>

  <button type="button" class="login-btn" id="loginActionBtn">⟡ Login ⟡</button>
  <p class="register">
    ✨ No account yet? <a href="#" id="registerTrigger">Create account</a>
  </p>
</form>

<div id="dynamicToast" class="toast-message"></div>

<script>
  const loginBtn = document.getElementById('loginActionBtn');
  const toast = document.getElementById('dynamicToast');
  const usernameInput = document.getElementById('loginUsername');
  const passwordInput = document.getElementById('loginPassword');
  const usernameBox = document.getElementById('usernameBox');
  const passwordBox = document.getElementById('passwordBox');

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(()=>{ toast.classList.remove('show'); }, 2000);
  }

  loginBtn.addEventListener('click',()=>{
    let emptyFields = false;
    if(!usernameInput.value.trim()){
      usernameBox.classList.add('error-shake');
      emptyFields = true;
      setTimeout(()=>{usernameBox.classList.remove('error-shake');},400);
    }
    if(!passwordInput.value.trim()){
      passwordBox.classList.add('error-shake');
      emptyFields = true;
      setTimeout(()=>{passwordBox.classList.remove('error-shake');},400);
    }
    if(emptyFields){
      showToast("⚠️ Please fill in all fields!");
      return;
    }
    showToast(`✅ Welcome, ${usernameInput.value}!`);
  });
</script>

</body>
</html>
