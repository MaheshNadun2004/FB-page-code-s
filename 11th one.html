<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Footer Design</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Dummy content */
    .content {
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    /* Footer */
    .footer {
      background: #0f172a;
      color: #fff;
      text-align: center;
      padding: 30px 20px;
    }

    .footer-container {
      max-width: 800px;
      margin: auto;
    }

    .logo {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 15px;
    }

    .socials a {
      color: #38bdf8;
      margin: 0 10px;
      text-decoration: none;
      font-size: 14px;
    }

    .socials a:hover {
      text-decoration: underline;
    }

    .copy {
      margin-top: 15px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="content">
    Your Website Content Here
  </div>

  <footer class="footer">
    <div class="footer-container">
      
      <h2 class="logo">CodeNova LK</h2>
      
      <p class="desc">
        Learn coding with simple tutorials. HTML, CSS, JavaScript & more.
      </p>

      <div class="socials">
        <a href="#">Facebook</a>
        <a href="#">GitHub</a>
        <a href="#">LinkedIn</a>
      </div>

      <p class="copy">
        © 2026 CodeNova LK | All Rights Reserved
      </p>

    </div>
  </footer>

</body>
</html>
