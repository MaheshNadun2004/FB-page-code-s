<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeNova LK</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            padding: 50px;
        }
        form{
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0px 0px 15px rgba(0, 0, 0,0.1);
        }
        h2{
            text-align: center;
            margin-bottom: 20px;
        }
        label{
            font-weight: bold;
        }
        input[type="text"], input[type="email"] , input[type="password"] , input[type="number"] , select{
            width: 100%;
            padding: 10px;
            margin: 5px 0px 15px 0;
            border-radius: 6px;border: 1px solid #ccc;

        }

        input[type="submit"]{
            background-color: #4caf50;
            color: wheat;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        input[type="submit"]:hover{
            background-color: #45a049;
        }
        .radio-group , .checkbox-group{
            margin-bottom: 15px;
        }
        .radio-group label, . .checkbox-group label{
            font-weight: normal;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h2>User Registration Form</h2>

    <form action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
        
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter a password" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" min="1" max="12" required>

        <label for="gender">Gender:</label>
        <div class="radio-group">
            <input type="radio" name="gender" id="mali" value="male" required>
            <label for="male">Male</label>

            <input type="radio" name="gender" id="mali" value="female" required>
            <label for="male">Female</label>

            <input type="radio" name="gender" id="mali" value="other" required>
            <label for="male">other</label>
        </div>

        <label for="country">Country:</label>
        <select name="country" id=""content required>
            <option value=""> Select your country</option>
            <option value="Sri Lanka">Sri Lanka</option>
            <option value="india">India</option>
            <option value="Usa">Usa</option>
            <option value="Uk">Uk</option>
        </select>

        <div class="checkboox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I accept the Terms and Conditions</label>
        </div>

        <input type="submit" value="Register">
    </form>
</body>
</html>
