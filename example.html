<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeNova LK</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f0f0;
  }

  .clock {
    width: 300px;
    height: 300px;
    border: 10px solid #333;
    border-radius: 50%;
    position: relative;
    background: white;
  }

  .center {
    width: 15px;
    height: 15px;
    background: #333;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }

  .hand {
    width: 50%;
    height: 4px;
    background: #333;
    position: absolute;
    top: 50%;
    transform-origin: 100%;
    transform: rotate(90deg);
    transition: transform 0.5s ease-in-out;
  }

  .hour { height: 6px; background: #000; z-index: 3; }
  .minute { background: #555; z-index: 2; }
  .second { background: red; height: 2px; z-index: 1; }

  .number {
    position: absolute;
    font-weight: bold;
    font-size: 1.2em;
    color: #333;
    top: 50%;
    left: 50%;
    transform-origin: center -130px; 
  }

  .num1  { transform: rotate(30deg)  translateY(-130px) rotate(-30deg); }
  .num2  { transform: rotate(60deg)  translateY(-130px) rotate(-60deg); }
  .num3  { transform: rotate(90deg)  translateY(-130px) rotate(-90deg); }
  .num4  { transform: rotate(120deg) translateY(-130px) rotate(-120deg); }
  .num5  { transform: rotate(150deg) translateY(-130px) rotate(-150deg); }
  .num6  { transform: rotate(180deg) translateY(-130px) rotate(-180deg); }
  .num7  { transform: rotate(210deg) translateY(-130px) rotate(-210deg); }
  .num8  { transform: rotate(240deg) translateY(-130px) rotate(-240deg); }
  .num9  { transform: rotate(270deg) translateY(-130px) rotate(-270deg); }
  .num10 { transform: rotate(300deg) translateY(-130px) rotate(-300deg); }
  .num11 { transform: rotate(330deg) translateY(-130px) rotate(-330deg); }
  .num12 { transform: rotate(0deg)   translateY(-130px) rotate(0deg); }

</style>
</head>
<body>
<div class="clock">
  <div class="center"></div>
  <div class="hand hour" id="hour"></div>
  <div class="hand minute" id="minute"></div>
  <div class="hand second" id="second"></div>

  <div class="number num1">1</div>
  <div class="number num2">2</div>
  <div class="number num3">3</div>
  <div class="number num4">4</div>
  <div class="number num5">5</div>
  <div class="number num6">6</div>
  <div class="number num7">7</div>
  <div class="number num8">8</div>
  <div class="number num9">9</div>
  <div class="number num10">10</div>
  <div class="number num11">11</div>
  <div class="number num12">12</div>
</div>

<script>
function updateClock() {
  const now = new Date();
  const s = now.getSeconds();
  const m = now.getMinutes();
  const h = now.getHours();
  document.getElementById('second').style.transform = `rotate(${(s/60)*360 + 90}deg)`;
  document.getElementById('minute').style.transform = `rotate(${(m/60)*360 + (s/60)*6 + 90}deg)`;
  document.getElementById('hour').style.transform = `rotate(${(h/12)*360 + (m/60)*30 + 90}deg)`;
}
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
